version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: employee-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: employee-db
      MYSQL_USER: mijngebruiker
      MYSQL_PASSWORD: mijnwachtwoord
    ports:
      - "3306:3306"
    volumes:
      - employee_data:/var/lib/mysql

volumes:
  employee_data: